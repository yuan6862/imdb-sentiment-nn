name: Train and Upload to Hugging Face

on:
  push:
    branches: [main, master]

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch (CPU-only, faster download)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install other dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Upload model to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PYEOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi()
          repo_id = "enzoliao/imdb-sentiment-nn"
          token = os.environ["HF_TOKEN"]

          api.create_repo(repo_id=repo_id, token=token, exist_ok=True, private=False)

          # Upload the full model directory (DistilBERT weights + tokenizer + metrics)
          api.upload_folder(
              folder_path="model",
              repo_id=repo_id,
              token=token,
              ignore_patterns=["checkpoint-*"],
          )
          print(f"Uploaded model directory")

          # Upload README separately
          api.upload_file(
              path_or_fileobj="README.md",
              path_in_repo="README.md",
              repo_id=repo_id,
              token=token,
          )
          print(f"Uploaded README.md")

          print(f"\nDone! https://huggingface.co/{repo_id}")
          PYEOF
